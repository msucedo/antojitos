<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoja de contacto del sprite</title>
    <!-- Herramienta de desarrollo: solo la sirve `vite` (npm run dev). No entra en el build. -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        display: block;
        padding: 16px;
        background-image: none;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .sheet {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 12px;
      }
      .cell {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 12px;
        align-items: center;
        padding: 14px;
      }
      .cell .big {
        width: 160px;
        height: 160px;
      }
      .cell .small {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .cell .i30 {
        width: 30px;
        height: 30px;
      }
      .cell .i20 {
        width: 20px;
        height: 20px;
      }
      /* Retrato como en el cupón (120) y en el disco del lateral (36, recorte circular). */
      .cell .i120 {
        width: 120px;
        height: 120px;
      }
      .cell .i36 {
        width: 36px;
        height: 36px;
        border-radius: 50%;
      }
      .cell .name {
        font-weight: 700;
        margin: 0 0 8px;
      }
      /* Plato tal cual en el juego: sello detrás, icono de 52 con estampa encima. */
      .sell {
        --aro: var(--primary);
      }
      .refs {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
      }
      .refs img {
        height: 220px;
        border-radius: 8px;
        border: 2px solid var(--ink);
      }
    </style>
  </head>
  <body>
    <h1>Sprite: <span id="count"></span> símbolos</h1>
    <ul class="sheet" id="sheet"></ul>
    <h1>Platos raster: <span id="count-platos"></span> (src/assets/platos)</h1>
    <ul class="sheet" id="platos"></ul>
    <h1>Retratos: <span id="count-retratos"></span> personajes (src/assets/personajes)</h1>
    <ul class="sheet" id="retratos"></ul>
    <h1>Referencias (docs/refs)</h1>
    <div class="refs" id="refs"></div>
    <script type="module">
      import { PORTRAITS } from '/src/characters.ts';
      import { PLATOS } from '/src/platos.ts';
      import { BUSINESSES, CHELO } from '/src/data.ts';

      const SPRITE = '/src/assets/icons.svg';
      const svg = (id, cls) =>
        `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true"><use href="${SPRITE}#${id}"></use></svg>`;
      const text = await (await fetch(SPRITE)).text();
      const ids = [...text.matchAll(/<symbol id="([^"]+)"/g)].map((m) => m[1]);
      // Cada negocio se pinta sobre el papel real de su tarjeta.
      const papel = new Map(BUSINESSES.map((b) => [b.icon, b.papel]));
      document.getElementById('count').textContent = ids.length;
      document.getElementById('sheet').innerHTML = ids
        .map(
          (id) => `<li class="card" data-papel="${papel.get(id) ?? ''}">
            <div class="cell paper">
              ${svg(id, 'icon big')}
              <div>
                <p class="name">${id}${papel.has(id) ? ` · ${papel.get(id)}` : ''}</p>
                <div class="small">
                  <span class="sell">${svg('sello', 'icon sello sticker')}${svg(id, 'icon sell-icon sticker')}</span>
                  ${svg(id, 'icon i30')}
                  ${svg(id, 'icon i20')}
                </div>
              </div>
            </div>
          </li>`,
        )
        .join('');
      // Platos raster: cada uno sobre el papel de su negocio, a 160, en el plato real (56 móvil, 50 web) y a 30.
      const platos = Object.entries(PLATOS);
      document.getElementById('count-platos').textContent = platos.length;
      document.getElementById('platos').innerHTML = platos
        .map(
          ([id, src]) => `<li class="card owned" data-papel="${papel.get(id) ?? ''}">
            <div class="cell paper">
              <img class="icon big" src="${src}" alt="" />
              <div>
                <p class="name">${id} · ${papel.get(id) ?? ''}</p>
                <div class="small">
                  <span class="sell">${svg('sello', 'icon sello sticker')}<img class="icon sell-icon" src="${src}" alt="" /></span>
                  <img class="icon i30" src="${src}" alt="" />
                </div>
              </div>
            </div>
          </li>`,
        )
        .join('');
      // Retratos raster: cada gerente sobre el papel de su negocio; Chelo sobre el papel base.
      const papelDe = new Map(BUSINESSES.map((b) => [b.manager.id, b.papel]));
      const nombre = new Map([[CHELO.id, CHELO.name], ...BUSINESSES.map((b) => [b.manager.id, b.manager.name])]);
      const retratos = Object.entries(PORTRAITS);
      document.getElementById('count-retratos').textContent = retratos.length;
      document.getElementById('retratos').innerHTML = retratos
        .map(
          ([id, src]) => `<li class="card" data-papel="${papelDe.get(id) ?? ''}">
            <div class="cell paper">
              <img class="icon big" src="${src}" alt="" />
              <div>
                <p class="name">${id} · ${nombre.get(id)}${papelDe.has(id) ? ` · ${papelDe.get(id)}` : ''}</p>
                <div class="small">
                  <img class="icon i120" src="${src}" alt="" />
                  <img class="icon i36" src="${src}" alt="" />
                </div>
              </div>
            </div>
          </li>`,
        )
        .join('');
      const refs = [
        'estampas1',
        'estampas2',
        'estampas3',
        'estampas4',
        'letra',
        'iconos-tarjetas1',
        'iconos-tarjetas2',
        'iconos-tarjetas3',
      ];
      document.getElementById('refs').innerHTML = refs
        .map((r) => `<img src="/docs/refs/${r}.png" alt="${r}" />`)
        .join('');
    </script>
  </body>
</html>
