<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Fondo de la app: azulejo de 192 px, siluetas planas de antojitos sin contorno.
    Colores de la paleta a fill-opacity 0.09 para que funcione en tema claro y oscuro
    y no baje el contraste del texto que cae encima. Sin style, script ni recursos externos (CSP).
  -->
  <g fill-opacity="0.09">
    <!-- elote -->
    <g transform="translate(30 36) rotate(-14)">
      <rect x="-7" y="-22" width="14" height="36" rx="7" fill="#F4C430"/>
      <path d="M-4 10c-9-2-13-9-12-18 6 2 10 8 12 18z" fill="#3A7D44"/>
      <path d="M4 10c9-2 13-9 12-18-6 2-10 8-12 18z" fill="#3A7D44"/>
      <rect x="-2" y="12" width="4" height="14" rx="2" fill="#B07850"/>
    </g>
    <!-- chile -->
    <g transform="translate(112 30) rotate(24)">
      <path d="M-4-16c10 0 14 10 10 24-3 10-6 16-8 20-3-6-8-14-10-26-2-10 1-18 8-18z" fill="#E5484D"/>
      <path d="M-6-18c0-5 4-8 8-6-3 2-4 4-4 8z" fill="#3A7D44"/>
    </g>
    <!-- concha -->
    <g transform="translate(160 86) rotate(8)">
      <path d="M-22 10c0-16 10-24 22-24s22 8 22 24z" fill="#E4007C"/>
      <rect x="-22" y="10" width="44" height="6" rx="3" fill="#E4007C"/>
    </g>
    <!-- flor de papel picado -->
    <g transform="translate(70 100) rotate(10)">
      <circle cx="0" cy="-10" r="6" fill="#1F7FC2"/>
      <circle cx="9.5" cy="-3" r="6" fill="#1F7FC2"/>
      <circle cx="6" cy="8" r="6" fill="#1F7FC2"/>
      <circle cx="-6" cy="8" r="6" fill="#1F7FC2"/>
      <circle cx="-9.5" cy="-3" r="6" fill="#1F7FC2"/>
      <circle cx="0" cy="0" r="4" fill="#F4C430"/>
    </g>
    <!-- taco -->
    <g transform="translate(34 156) rotate(-10)">
      <path d="M-22 8a22 22 0 0 1 44 0z" fill="#F4C430"/>
      <path d="M-14 0c6-6 22-6 28 0-6 2-22 2-28 0z" fill="#E5484D"/>
    </g>
    <!-- limón -->
    <g transform="translate(120 150) rotate(0)">
      <circle cx="0" cy="0" r="12" fill="#3A7D44"/>
      <path d="M8-10c6-4 12-4 16 0-4 4-10 4-16 0z" fill="#3A7D44"/>
    </g>
    <!-- banderín pequeño -->
    <g transform="translate(166 174) rotate(14)">
      <path d="M-9-10h18v14l-4.5 4-4.5-4-4.5 4-4.5-4z" fill="#E4007C"/>
    </g>
  </g>
</svg>
