    <path d="M17 10L33 6v8L17 18z" fill="#E4007C" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="13" cy="35" rx="7" ry="5" transform="rotate(-20 13 35)" fill="#E4007C" stroke="#1B2A3A" stroke-width="3"/>
    <ellipse cx="29" cy="31" rx="7" ry="5" transform="rotate(-20 29 31)" fill="#E4007C" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M20 12.5l6-1.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#1B2A3A" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
  <!-- engrane: rueda dentada de metal (gris de la caja fuerte) con aro claro, eje de tinta y brillo. Ajustes. -->
  <symbol id="engrane" viewBox="0 0 48 48">
    <path d="M20.7 3.3L27.3 3.3L27.7 9L32 10.7L36.3 7L41 11.7L37.3 16L39 20.3L44.7 20.7L44.7 27.3L39 27.7L37.3 32L41 36.3L36.3 41L32 37.3L27.7 39L27.3 44.7L20.7 44.7L20.3 39L16 37.3L11.7 41L7 36.3L10.7 32L9 27.7L3.3 27.3L3.3 20.7L9 20.3L10.7 16L7 11.7L11.7 7L16 10.7L20.3 9z" fill="#C8C8C8" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="9" fill="#DADADA" stroke="#1B2A3A" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="4" fill="#1B2A3A"/>
    <path d="M17.5 12.5l4-1.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <!-- Iconos de interfaz: un solo color (currentColor). ajustes: el mismo engrane en silueta, para el header móvil a 24 px. -->
  <symbol id="ajustes" viewBox="0 0 48 48">
    <path d="M20.7 3.3L27.3 3.3L27.7 9L32 10.7L36.3 7L41 11.7L37.3 16L39 20.3L44.7 20.7L44.7 27.3L39 27.7L37.3 32L41 36.3L36.3 41L32 37.3L27.7 39L27.3 44.7L20.7 44.7L20.3 39L16 37.3L11.7 41L7 36.3L10.7 32L9 27.7L3.3 27.3L3.3 20.7L9 20.3L10.7 16L7 11.7L11.7 7L16 10.7L20.3 9zM24 17a7 7 0 1 0 0 14a7 7 0 1 0 0-14z" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- Ranking: copa en silueta currentColor para el header (24 px), como ajustes e historial-sil. -->
  <symbol id="trofeo-sil" viewBox="0 0 48 48">
    <path d="M13 5h22v10c0 6.5-4.5 11.5-9 13v5h6v4H16v-4h6v-5c-4.5-1.5-9-6.5-9-13z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
