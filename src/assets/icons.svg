    <rect x="8" y="7" width="32" height="32" rx="4" fill="#C8C8C8" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="13" y="12" width="22" height="22" rx="3" fill="#DADADA" stroke="#1B2A3A" stroke-width="2.5"/>
    <circle cx="22" cy="23" r="5" fill="#1B2A3A"/>
    <path d="M22 19.5v3.5" fill="none" stroke="#F4C430" stroke-width="2" stroke-linecap="round"/>
    <path d="M31 19v8" fill="none" stroke="#F4C430" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 11h5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
