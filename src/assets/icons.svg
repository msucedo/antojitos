<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Sprite de iconos propios de Imperio de Antojitos. viewBox 48×48 (banderin: 24×28).
    Caricatura: formas gordas y redondas, contorno fijo de tinta #1B2A3A de 3,
    rellenos de comida en hex fijo, un brillo blanco de pegatina por pieza y detalles internos con trazos 2
    en un tono más oscuro del relleno. Los iconos de interfaz compactos (header móvil, estado) siguen en currentColor.
    Sin atributos de estilo, hojas de estilo, scripts, handlers ni recursos externos: compatible con CSP.
  -->

  <!-- Objetos ilustrados: caricatura gorda, contorno tinta 3, brillo blanco de pegatina. Los platos de los negocios son raster (src/assets/platos). -->
  <symbol id="upgrade" viewBox="0 0 48 48">
    <path d="M4 30l10-10h26a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H14z" fill="#E8C99A" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="12" cy="30" r="2.2" fill="#FFF6E5" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M19 33.5h14" fill="none" stroke="#B5562B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 3.5l2.94 6.45 7.05.81-5.23 4.79 1.41 6.94L30 19l-6.17 3.49 1.41-6.94-5.23-4.79 7.05-.81z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M19 26.5h7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="recipe" viewBox="0 0 48 48">
    <rect x="8" y="5" width="32" height="38" rx="4" fill="#F6E3C3" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M8 9a4 4 0 0 1 4-4h5v38h-5a4 4 0 0 1-4-4z" fill="#D9A15B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 14h12M22 20h12" fill="none" stroke="#B5562B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M24 28v-3.5" fill="none" stroke="#3A7D44" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="33" r="5.5" fill="#E5484D" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M32 33h6v11l-3-3-3 3z" fill="#E4007C" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 9.5h5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="banderin" viewBox="0 0 24 28">
    <path fill="currentColor" fill-rule="evenodd" d="M0 0h24v22a4 4 0 0 1-8 0a4 4 0 0 1-8 0a4 4 0 0 1-8 0zM9.5 5.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0zM12 17.5c-2.4-1.8-3.6-3-3.6-4.6a1.8 1.8 0 0 1 3.6-.5a1.8 1.8 0 0 1 3.6.5c0 1.6-1.2 2.8-3.6 4.6zM4 10.5l1.8 2.2L4 15l-1.8-2.2zM20 10.5l1.8 2.2L20 15l-1.8-2.2z"/>
  </symbol>

  <!--
    Iconos del menú lateral (web): ilustrados, dibujados para 30 px. Cantidad: moneda (×1),
    monedas (×10), costal (Máx). Ajustes: engrane. Caja fuerte (Respaldo, hoy solo estampilla de logro),
    bocina (Sonido) y guitarra (Música) viven en los botones del diálogo Ajustes.
    Las variantes -off repiten el dibujo y añaden la barra diagonal de tinta con halo blanco (se ve sobre papel y sobre azul noche).
  -->
  <!-- moneda: disco de oro con aro interior y "$" en trazo. -->
  <symbol id="moneda" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="16" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <circle cx="24" cy="24" r="11.5" fill="none" stroke="#C99700" stroke-width="2"/>
    <path d="M24 15v18M28.5 19c-1.5-2-8-2.5-8 1.5s8 2 8 6-6.5 3.5-8.5 1.5" fill="none" stroke="#C99700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.5 18a12 12 0 0 1 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- monedas: tres cantos apilados y la cara superior con "$". -->
  <symbol id="monedas" viewBox="0 0 48 48">
    <rect x="8" y="30" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="8" y="22" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="8" y="14" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <ellipse cx="24" cy="14" rx="16" ry="6" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M24 10.5v7M26.5 12.5c-.8-1-4.5-1-4.5.7s4.5 1 4.5 2.6-3.7 1.6-4.7.8" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 13.5c1-1.5 3-2.5 5-3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- costal: bolsa de yute con cuerda y "$" grande. -->
