    <path d="M24 14v20" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 20l7-3.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 17a8 8 0 0 1 0 14M37 12a14 14 0 0 1 0 24" fill="none" stroke="#1B2A3A" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="bocina-off" viewBox="0 0 48 48">
    <rect x="5" y="18" width="7" height="12" rx="2" fill="#C99700" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M11 20l16-9v26L11 28z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M24 14v20" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 20l7-3.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#1B2A3A" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
