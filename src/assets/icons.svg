    <path d="M30 13.5v21" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round"/>
    <path d="M39 17a9 9 0 0 1 0 14M43.5 12a15 15 0 0 1 0 24" fill="none" stroke="#1B2A3A" stroke-width="3" stroke-linecap="round"/>
