<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Sprite de iconos propios de Imperio de Antojitos. viewBox 48×48 (banderin: 24×28).
    Caricatura: formas gordas y redondas, contorno fijo de tinta #1B2A3A de 3,
    rellenos de comida en hex fijo, un brillo blanco de pegatina por pieza y detalles internos con trazos 2
    en un tono más oscuro del relleno. Los iconos de interfaz siguen en currentColor.
    Sin atributos de estilo, hojas de estilo, scripts, handlers ni recursos externos: compatible con CSP.
  -->

  <!-- Objetos ilustrados: caricatura gorda, contorno tinta 3, brillo blanco de pegatina. Los platos de los negocios son raster (src/assets/platos). -->
  <symbol id="upgrade" viewBox="0 0 48 48">
    <path d="M4 30l10-10h26a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H14z" fill="#E8C99A" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="12" cy="30" r="2.2" fill="#FFF6E5" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M19 33.5h14" fill="none" stroke="#B5562B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 3.5l2.94 6.45 7.05.81-5.23 4.79 1.41 6.94L30 19l-6.17 3.49 1.41-6.94-5.23-4.79 7.05-.81z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M19 26.5h7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="recipe" viewBox="0 0 48 48">
    <rect x="8" y="5" width="32" height="38" rx="4" fill="#F6E3C3" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M8 9a4 4 0 0 1 4-4h5v38h-5a4 4 0 0 1-4-4z" fill="#D9A15B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 14h12M22 20h12" fill="none" stroke="#B5562B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M24 28v-3.5" fill="none" stroke="#3A7D44" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="33" r="5.5" fill="#E5484D" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M32 33h6v11l-3-3-3 3z" fill="#E4007C" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 9.5h5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="banderin" viewBox="0 0 24 28">
    <path fill="currentColor" fill-rule="evenodd" d="M0 0h24v22a4 4 0 0 1-8 0a4 4 0 0 1-8 0a4 4 0 0 1-8 0zM9.5 5.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0zM12 17.5c-2.4-1.8-3.6-3-3.6-4.6a1.8 1.8 0 0 1 3.6-.5a1.8 1.8 0 0 1 3.6.5c0 1.6-1.2 2.8-3.6 4.6zM4 10.5l1.8 2.2L4 15l-1.8-2.2zM20 10.5l1.8 2.2L20 15l-1.8-2.2z"/>
  </symbol>

  <!--
    Iconos del menú lateral (web): ilustrados, dibujados para 30 px. Cantidad: moneda (×1),
    monedas (×10), costal (Máx). Respaldo: caja fuerte. Sonido: bocina. Música: guitarra.
    Las variantes -off repiten el dibujo y añaden la barra diagonal de tinta.
  -->
  <!-- moneda: disco de oro con aro interior y "$" en trazo. -->
  <symbol id="moneda" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="16" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <circle cx="24" cy="24" r="11.5" fill="none" stroke="#C99700" stroke-width="2"/>
    <path d="M24 15v18M28.5 19c-1.5-2-8-2.5-8 1.5s8 2 8 6-6.5 3.5-8.5 1.5" fill="none" stroke="#C99700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.5 18a12 12 0 0 1 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- monedas: tres cantos apilados y la cara superior con "$". -->
  <symbol id="monedas" viewBox="0 0 48 48">
    <rect x="8" y="30" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="8" y="22" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="8" y="14" width="32" height="8" rx="4" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <ellipse cx="24" cy="14" rx="16" ry="6" fill="#F4C430" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M24 10.5v7M26.5 12.5c-.8-1-4.5-1-4.5.7s4.5 1 4.5 2.6-3.7 1.6-4.7.8" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 13.5c1-1.5 3-2.5 5-3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- costal: bolsa de yute con cuerda y "$" grande. -->
  <symbol id="costal" viewBox="0 0 48 48">
    <path d="M18 13h12c0 4 3 5 6 9 4 5 5 10 4 15-1 4-5 6-16 6S9 41 8 37c-1-5 0-10 4-15 3-4 6-5 6-9z" fill="#E8C99A" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15 15h18" fill="none" stroke="#B5562B" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 18l-1.5 4M28 18l1.5 4" fill="none" stroke="#B07850" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 24v13M28.5 27.5c-1.5-2-8-2.5-8 1.5s8 2 8 6-6.5 3.5-8.5 1.5" fill="none" stroke="#B5562B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 27c1.5 2 2.5 4.5 2.5 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- caja: caja fuerte con puerta, dial, manija y patas. -->
  <symbol id="caja" viewBox="0 0 48 48">
    <path d="M13 39v3M35 39v3" fill="none" stroke="#1B2A3A" stroke-width="3" stroke-linecap="round"/>
    <rect x="8" y="7" width="32" height="32" rx="4" fill="#C8C8C8" stroke="#1B2A3A" stroke-width="3"/>
    <rect x="13" y="12" width="22" height="22" rx="3" fill="#DADADA" stroke="#1B2A3A" stroke-width="2.5"/>
    <circle cx="22" cy="23" r="5" fill="#1B2A3A"/>
    <path d="M22 19.5v3.5" fill="none" stroke="#F4C430" stroke-width="2" stroke-linecap="round"/>
    <path d="M31 19v8" fill="none" stroke="#F4C430" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 11h5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- bocina: cono de latón con base y dos ondas. -->
  <symbol id="bocina" viewBox="0 0 48 48">
    <rect x="7" y="18" width="8" height="12" rx="2" fill="#C99700" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M14 20l20-10v28L14 28z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 13.5v21" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round"/>
    <path d="M39 17a9 9 0 0 1 0 14M43.5 12a15 15 0 0 1 0 24" fill="none" stroke="#1B2A3A" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 20l7-3.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="bocina-off" viewBox="0 0 48 48">
    <rect x="7" y="18" width="8" height="12" rx="2" fill="#C99700" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M14 20l20-10v28L14 28z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 13.5v21" fill="none" stroke="#C99700" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 20l7-3.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#1B2A3A" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
  <!-- guitarra: cuerpo de dos lóbulos en 3/4, mástil corto y clavijero. -->
  <symbol id="guitarra" viewBox="0 0 48 48">
    <path d="M27 21l12-12" fill="none" stroke="#1B2A3A" stroke-width="9" stroke-linecap="round"/>
    <path d="M27 21l12-12" fill="none" stroke="#B07850" stroke-width="4" stroke-linecap="round"/>
    <rect x="36" y="4" width="8" height="8" rx="2" fill="#2B1B17" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M22 17c5 0 8 3 8 7s-3 5-3 8-1 9-9 9-10-5-10-10 2-5 4-8 5-6 10-6z" fill="#D9A15B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="19" cy="28" r="4" fill="#2B1B17"/>
    <rect x="14" y="35" width="8" height="3" rx="1.5" fill="#B07850"/>
    <path d="M12 24c1-2 3-3.5 5-4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="guitarra-off" viewBox="0 0 48 48">
    <path d="M27 21l12-12" fill="none" stroke="#1B2A3A" stroke-width="9" stroke-linecap="round"/>
    <path d="M27 21l12-12" fill="none" stroke="#B07850" stroke-width="4" stroke-linecap="round"/>
    <rect x="36" y="4" width="8" height="8" rx="2" fill="#2B1B17" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M22 17c5 0 8 3 8 7s-3 5-3 8-1 9-9 9-10-5-10-10 2-5 4-8 5-6 10-6z" fill="#D9A15B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="19" cy="28" r="4" fill="#2B1B17"/>
    <rect x="14" y="35" width="8" height="3" rx="1.5" fill="#B07850"/>
    <path d="M12 24c1-2 3-3.5 5-4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 6l36 36" fill="none" stroke="#1B2A3A" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
  <!-- Iconos de interfaz: un solo color (currentColor). -->
  <symbol id="sound-on" viewBox="0 0 48 48">
    <path d="M8 18h7l10-8v28l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M31 18a8 8 0 0 1 0 12M35 13a15 15 0 0 1 0 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="sound-off" viewBox="0 0 48 48">
    <path d="M8 18h7l10-8v28l-10-8H8z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 19l10 10M42 19L32 29" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="music-on" viewBox="0 0 48 48">
    <path d="M18 34V10l20-4v24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="13" cy="35" rx="6" ry="5" fill="currentColor"/>
    <ellipse cx="33" cy="31" rx="6" ry="5" fill="currentColor"/>
    <path d="M18 16l20-4" fill="none" stroke="currentColor" stroke-width="3"/>
  </symbol>

  <symbol id="music-off" viewBox="0 0 48 48">
    <path d="M18 34V10l20-4v24" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>
    <ellipse cx="13" cy="35" rx="6" ry="5" fill="currentColor" opacity="0.6"/>
    <ellipse cx="33" cy="31" rx="6" ry="5" fill="currentColor" opacity="0.6"/>
    <path d="M6 6l36 36" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="personajes" viewBox="0 0 48 48">
    <path d="M18 4l6 10 6-10" fill="none" stroke="#1F7FC2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="12" width="8" height="5" rx="1.5" fill="#C8C8C8" stroke="#1B2A3A" stroke-width="2.5"/>
    <rect x="6" y="16" width="36" height="28" rx="4" fill="#FFF6E5" stroke="#1B2A3A" stroke-width="3"/>
    <path d="M10 40c0-5 4-8 8-8s8 3 8 8z" fill="#E4007C" stroke="#1B2A3A" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="18" cy="26" r="5" fill="#D9A15B" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M29 25h9M29 31h9M29 37h6" fill="none" stroke="#C8C8C8" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="gente" viewBox="0 0 48 48">
    <circle cx="18" cy="15" r="7.5" fill="currentColor"/>
    <path d="M4 40c0-9 6-15 14-15s14 6 14 15z" fill="currentColor"/>
    <circle cx="34" cy="18" r="6" fill="currentColor"/>
    <path d="M34 26c6 0 10 5 10 12v2h-8.5c0-5.5-1.5-10-4.5-13.2 1-.5 2-.8 3-.8z" fill="currentColor"/>
  </symbol>

  <symbol id="menu" viewBox="0 0 48 48">
    <circle cx="12" cy="24" r="3.5" fill="currentColor"/>
    <circle cx="24" cy="24" r="3.5" fill="currentColor"/>
    <circle cx="36" cy="24" r="3.5" fill="currentColor"/>
  </symbol>

  <symbol id="lock" viewBox="0 0 48 48">
    <path d="M15 21v-6a9 9 0 0 1 18 0v6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="10" y="21" width="28" height="21" rx="4" fill="currentColor"/>
  </symbol>

  <!-- clavo: cabeza redonda de metal (gris de la caja fuerte) con brillo; va en el letrero de la tarjeta a 10 px. -->
  <symbol id="clavo" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" fill="#C8C8C8" stroke="#1B2A3A" stroke-width="3"/>
    <circle cx="24" cy="24" r="7" fill="#1B2A3A"/>
    <path d="M14 15.5a12 12 0 0 1 8-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <!-- Estrella de antigüedad (cupón de Empleados, 16 px): elote con brillo; -off en metal claro, sin brillo. -->
  <symbol id="estrella" viewBox="0 0 48 48">
    <path d="M24.0 5.5L29.3 18.2L43.0 19.3L32.6 28.3L35.8 41.7L24.0 34.5L12.2 41.7L15.4 28.3L5.0 19.3L18.7 18.2Z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M17 19.5l3.5-1" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="estrella-off" viewBox="0 0 48 48">
    <path d="M24.0 5.5L29.3 18.2L43.0 19.3L32.6 28.3L35.8 41.7L24.0 34.5L12.2 41.7L15.4 28.3L5.0 19.3L18.7 18.2Z" fill="#DADADA" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
  </symbol>
  <!-- album: álbum de estampillas (Álbum de logros). Tapa tostada con lomo, una estampilla crema pegada con motivo rosa, brillo. 5 elementos. -->
  <symbol id="album" viewBox="0 0 48 48">
    <rect x="6" y="6" width="36" height="36" rx="4" fill="#B5562B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M6 10a4 4 0 0 1 4-4h5v36h-5a4 4 0 0 1-4-4z" fill="#A0522D" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <rect x="20" y="13" width="17" height="20" fill="#F6E3C3" stroke="#1B2A3A" stroke-width="2.5" stroke-dasharray="3 2.5" stroke-linejoin="round"/>
    <circle cx="28.5" cy="23" r="5" fill="#E4007C" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M20 9.5h6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>
