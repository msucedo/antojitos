    <path d="M16 21h16M16 27h12" fill="none" stroke="#B5562B" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 10.5h6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
