    <path d="M20 9.5h6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="logo" viewBox="0 0 48 48">
    <rect x="4" y="3" width="4" height="42" rx="2" fill="#D9A15B" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M9 6h33l-8 9 8 9H9z" fill="#F25C8F" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 44h28l3.5-18-9 7-8.5-12-8.5 12-9-7z" fill="#F4C430" stroke="#1B2A3A" stroke-width="3" stroke-linejoin="round"/>
